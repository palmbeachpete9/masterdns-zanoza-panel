name: CI

# NOTE: third-party actions below are referenced by major tag. They should be
# pinned to immutable commit SHAs (managed by Dependabot) for full supply-chain
# integrity (V4-05/V4-08); the distro shellcheck already avoids a mutable action.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Security patch floor (N01): must be >= the latest fixed stdlib patch level.
  GO_VERSION: "1.25.11"
  # Pinned tool versions for reproducible CI (R-08).
  GOVULNCHECK_VERSION: "v1.1.4"

jobs:
  go-panel:
    name: Panel (root module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go version
      - run: go vet ./cmd/...
      - run: go test -shuffle=on -count=2 ./cmd/...
      - run: go test -race -shuffle=on -count=1 ./cmd/...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  go-masterdns:
    name: MasterDNS (nested module)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: masterdns
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: masterdns/go.sum
      - run: go vet ./...
      - run: go test -shuffle=on -count=2 ./...
      - run: go test -race -shuffle=on -count=10 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  lint:
    name: golangci-lint + gofumpt (both modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Build the pinned linter from the root module (reproducible, R-08).
      - run: go build -o "$RUNNER_TEMP/golangci-lint" github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - name: lint root module
        run: |
          "$RUNNER_TEMP/golangci-lint" run ./...
      - name: gofumpt root + nested (enforced)
        run: |
          out="$(go run mvdan.cc/gofumpt -l -extra ./cmd ./tools masterdns/internal masterdns/cmd)"
          if [ -n "$out" ]; then echo "Unformatted files:"; echo "$out"; exit 1; fi
      # The full nested-module run reports a reviewed baseline of legacy upstream
      # findings (tracked, non-blocking).
      - name: lint nested module (informational baseline)
        continue-on-error: true
        working-directory: masterdns
        run: |
          "$RUNNER_TEMP/golangci-lint" run -c ../.golangci.yml ./...
      # ENFORCED on PRs: zero NEW nested-module findings relative to the base
      # branch. Regressions of the same classes now block the merge (R-10/V4-09).
      - name: lint nested module (enforce no new issues)
        if: github.event_name == 'pull_request'
        working-directory: masterdns
        run: |
          "$RUNNER_TEMP/golangci-lint" run -c ../.golangci.yml --new-from-merge-base "origin/${{ github.base_ref }}" ./...

  frontend:
    name: Frontend build + typecheck + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      # Generated assets must be clean after a build — no stale/duplicate
      # embedded files (R-11).
      - name: assert generated assets are clean
        run: git diff --exit-code -- cmd/zanoza-panel/web/dist
      # Production dependencies must have zero vulnerabilities (enforced, N03).
      - run: npm audit --omit=dev --audit-level=low
      # Dev tooling: ENFORCE no high/critical advisories. The only currently
      # accepted exceptions are two *moderate*, dev-server-only Vite/esbuild
      # advisories (not reachable in the shipped panel, which embeds a static
      # build). Review/upgrade target: next Vite major bump (V4-09).
      - run: npm audit --audit-level=high

  shell:
    name: Shell syntax + ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Use the distro shellcheck instead of a mutable third-party action (F27).
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bash -n scripts/install.sh scripts/zanoza
      - run: shellcheck --severity=warning scripts/install.sh scripts/zanoza
