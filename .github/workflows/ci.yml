name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Security patch floor (N01): must be >= the latest fixed stdlib patch level.
  GO_VERSION: "1.26.4"
  # Pinned tool versions for reproducible CI (R-08).
  GOVULNCHECK_VERSION: "v1.1.4"

jobs:
  go-panel:
    name: Panel (root module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go version
      - run: go vet ./cmd/...
      - run: go test -shuffle=on -count=2 ./cmd/...
      - run: go test -race -shuffle=on -count=1 ./cmd/...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  go-masterdns:
    name: MasterDNS (nested module)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: masterdns
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: masterdns/go.sum
      - run: go vet ./...
      - run: go test -shuffle=on -count=2 ./...
      - run: go test -race -shuffle=on -count=10 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  lint:
    name: golangci-lint + gofumpt (both modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Build the pinned linter from the root module (reproducible, R-08).
      - run: go build -o "$RUNNER_TEMP/golangci-lint" github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - name: lint root module
        run: |
          "$RUNNER_TEMP/golangci-lint" run ./...
      - name: gofumpt root + nested (enforced)
        run: |
          out="$(go run mvdan.cc/gofumpt -l -extra ./cmd ./tools masterdns/internal masterdns/cmd masterdns/scripts/bench)"
          if [ -n "$out" ]; then echo "Unformatted files:"; echo "$out"; exit 1; fi
      - name: lint nested module
        working-directory: masterdns
        run: |
          "$RUNNER_TEMP/golangci-lint" run -c ../.golangci.yml ./...

  frontend:
    name: Frontend build + typecheck + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20.19.0"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      # Generated assets must be clean after a build — no stale/duplicate
      # embedded files (R-11).
      - name: assert generated assets are clean
        run: |
          status="$(git status --porcelain=v1 --untracked-files=all -- cmd/zanoza-panel/web/dist)"
          [ -z "$status" ] || { echo "$status"; exit 1; }
      # Production dependencies must have zero vulnerabilities (enforced, N03).
      - run: npm audit --omit=dev --audit-level=low
      # Dev tooling must also have zero known advisories.
      - run: npm audit --audit-level=low

  shell:
    name: Shell syntax + ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Use the distro shellcheck instead of a mutable third-party action (F27).
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bash -n scripts/install.sh scripts/zanoza masterdns/server_linux_install.sh masterdns/docker/*.sh
      - run: shellcheck --severity=warning scripts/install.sh scripts/zanoza masterdns/server_linux_install.sh masterdns/docker/*.sh
      - name: supply-chain policy
        run: |
          bad_actions="$(grep -R --line-number -E 'uses:[[:space:]]+[^#[:space:]]+@' .github/workflows | grep -Ev '@[0-9a-f]{40}([[:space:]]+#.*)?$' || true)"
          [ -z "$bad_actions" ] || { echo "Unpinned actions:"; echo "$bad_actions"; exit 1; }
          ! grep -R --line-number -E 'RELEASE_TAG:-latest' scripts masterdns/docker README.en.md README.md
          ! grep -R --line-number -E '^FROM[[:space:]]+[^@[:space:]]+([[:space:]]+AS[[:space:]]+.*)?$' masterdns/docker/Dockerfile
          grep -q 'sed -n.*"digest"' scripts/install.sh
          ! grep -q 'install -d -o "\$SVC_USER".*"\$STATE_DIR/masterdns"' scripts/install.sh
          grep -q 'remote set-url origin "\$REPO"' scripts/install.sh
          grep -q 'find "$SRC_DIR" -mindepth 1 -maxdepth 1 -print -quit' scripts/install.sh
          grep -q 'git init -q "$SRC_DIR"' scripts/install.sh
          for arch in AMD64 ARM64 ARMV5 ARMV7 MIPS64LE; do grep -q "RELEASE_SHA256_${arch}" masterdns/docker/Dockerfile; done
