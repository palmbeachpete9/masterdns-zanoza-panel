version: "2"

linters:
  default: standard
  enable:
    - misspell      # опечатки в комментариях/строках
    - testifylint   # проверяет корректность testify-ассертов

formatters:
  enable:
    - gofumpt       # форматирование (строже чем gofmt)
    - goimports     # сортировка импортов + авто-добавление

run:
  tests: true

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  exclude-files:
    # Исключаем файлы вендора/генерённые если появятся
    - ".*\\.pb\\.go$"
    - ".*\\.gen\\.go$"
