services:
  masterdnsvpn:
    image: ${MASTERDNS_IMAGE:?set MASTERDNS_IMAGE to an immutable image@sha256 digest}
    restart: unless-stopped
    # Drop every Linux capability except the one needed to bind UDP/TCP :53, so
    # a server compromise has minimal kernel-level reach (V4-08).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    environment:
      - DOMAIN=v.example.com
    volumes:
      - masterdns-data:/data
    ports:
      - "53:53/tcp"
      - "53:53/udp"

volumes:
  masterdns-data:
